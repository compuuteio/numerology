[project]
name = "numerology"
version = "2.0.0a1"
description = "An extensible functional library for numerology systems."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Emmanuel GUENOU", email = "72025809+eguenou@users.noreply.github.com" },
    { name = "Andrii KRAVCHUK", email = "andrii@yakninja.pro" },
]
maintainers = [
    { name = "Emmanuel GUENOU", email = "72025809+eguenou@users.noreply.github.com" },
]
keywords = ["numerology", "pythagorean", "vedic", "clairvoyance", "voyance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Fortune Cookies",
    "Topic :: Religion",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.scripts]
numerology = "numerology.cli:main"

[project.urls]
Homepage = "https://github.com/compuuteio/numerology"
Repository = "https://github.com/compuuteio/numerology"
Documentation = "https://github.com/compuuteio/numerology#readme"
"Bug Tracker" = "https://github.com/compuuteio/numerology/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "mypy>=1.15",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "ruff>=0.15",
]

[tool.hatch.build]
artifacts = ["numerology/legacy/locale/**/*.mo"]

[tool.hatch.build.targets.wheel]
packages = ["numerology"]

[tool.hatch.build.targets.sdist]
include = [
    "/examples",
    "/numerology",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    "ignore:numerology\\.legacy is deprecated and will be removed in numerology 3:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "numerology/__init__.py",
    "numerology/cli.py",
    "numerology/common",
    "numerology/pythagorean",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["numerology/legacy"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
